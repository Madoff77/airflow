services:
  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow-tp2
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/config/airflow.db
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW_CONN_WEATHER_POSTGRES: postgresql://weather:weather@weather-postgres:5432/weather
    depends_on:
      - weather-postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
    command: >
      bash -c "
      set -e;
      airflow db migrate;
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true;
      airflow scheduler &
      exec airflow webserver -p 8080 -w 1 -t 300
      "

  weather-postgres:
    image: postgres:15
    container_name: weather-postgres
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather
    ports:
      - "5433:5432"
    volumes:
      - weather_postgres_data:/var/lib/postgresql/data

volumes:
  weather_postgres_data:
